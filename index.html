<meta name="theme-color" content="#E85B79">
<style>
  :root {
    --navy: #0A2846;
    --mid: #3D5A78;
    --steel: #8AA1B5;
    --pale: #CBD5DE;
    --ink: #191919;
    --sub: #5b6673;
    --line: #e3e8ee;
    --bg: #ffffff;
    --card: #ffffff;
    --soft: #F5F7FA;
    --hair: #2E2440;
    --c1: #E85B79;
    --c2: #F2A03D;
    --c3: #2FB89E;
    --c4: #4C8FDB;
    --c5: #9273DD;
    --c6: #EE7FAE;
    --rose: #E85B79;
    --rose-soft: #FDEFF3;
    --blush: #F6D9DF;
    --skin: #F7DFC9;
    --ok: #2E7D32;
    --warn: #B26A00;
    --bad: #C62828;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --navy: #cfe0f0; --mid: #8AA1B5; --pale: #2b3a4b;
      --ink: #e9edf2; --sub: #9aa7b5; --line: #24303d;
      --bg: #0e1620; --card: #16202c; --soft: #131c26;
      --hair: #241C33;
      --c1: #FF7B95; --c2: #FFBB63; --c3: #4ED6BB; --c4: #74AEF2; --c5: #B294F0; --c6: #F997C1;
      --rose: #FF7B95; --rose-soft: #2a1c24; --blush: #46303c; --skin: #F0D2B6;
      --ok: #6dbb71; --warn: #d9a13c; --bad: #ef7b7b;
    }
  }
  :root[data-theme="dark"] {
    --navy: #cfe0f0; --mid: #8AA1B5; --pale: #2b3a4b;
    --ink: #e9edf2; --sub: #9aa7b5; --line: #24303d;
    --bg: #0e1620; --card: #16202c; --soft: #131c26;
    --hair: #241C33;
    --c1: #FF7B95; --c2: #FFBB63; --c3: #4ED6BB; --c4: #74AEF2; --c5: #B294F0; --c6: #F997C1;
    --rose: #FF7B95; --rose-soft: #2a1c24; --blush: #46303c; --skin: #F0D2B6;
    --ok: #6dbb71; --warn: #d9a13c; --bad: #ef7b7b;
  }
  :root[data-theme="light"] {
    --navy: #0A2846; --mid: #3D5A78; --pale: #CBD5DE;
    --ink: #191919; --sub: #5b6673; --line: #e3e8ee;
    --bg: #ffffff; --card: #ffffff; --soft: #F5F7FA;
    --hair: #2E2440;
    --c1: #E85B79; --c2: #F2A03D; --c3: #2FB89E; --c4: #4C8FDB; --c5: #9273DD; --c6: #EE7FAE;
    --rose: #E85B79; --rose-soft: #FDEFF3; --blush: #FBDFE7; --skin: #FCE3CC;
    --ok: #2E7D32; --warn: #B26A00; --bad: #C62828;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  /* ---------- ログイン ---------- */
  #gate {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .gate-card {
    width: 100%;
    max-width: 380px;
  }
  /* ---------- 幾何学タイル（名刺由来のモザイク語彙） ---------- */
  .mosaic { display: grid; gap: 0; }
  .mosaic i { display: block; width: 100%; aspect-ratio: 1; }
  .t-sq   { border-radius: 0; }
  .t-ci   { border-radius: 50%; }
  .t-qtl  { border-radius: 100% 0 0 0; }
  .t-qtr  { border-radius: 0 100% 0 0; }
  .t-qbr  { border-radius: 0 0 100% 0; }
  .t-qbl  { border-radius: 0 0 0 100%; }
  .t-leaf { border-radius: 0 100% 0 100%; }
  .t-half { border-radius: 100% 100% 0 0; }
  .c-navy  { background: var(--navy); }
  .c-mid   { background: var(--mid); }
  .c-steel { background: var(--steel); }
  .c-pale  { background: var(--pale); }
  .c-1 { background: var(--c1); } .c-2 { background: var(--c2); } .c-3 { background: var(--c3); }
  .c-4 { background: var(--c4); } .c-5 { background: var(--c5); } .c-6 { background: var(--c6); }
  .c-none  { background: transparent; }

  /* ログイン画面のヒーローモザイク（4×4） */
  .hero-mosaic {
    grid-template-columns: repeat(4, 1fr);
    width: 172px; margin-bottom: 26px;
  }
  /* カード見出し脇の 2×2 ミニモザイク */
  .mini {
    grid-template-columns: repeat(2, 1fr);
    width: 30px; flex: 0 0 30px;
  }
  /* セクション見出しの葉型マーク */
  .leaf-mark {
    display: inline-block; width: 9px; height: 9px;
    background: var(--mid); border-radius: 0 100% 0 100%;
    margin-right: 9px; vertical-align: 1px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--navy); letter-spacing: .02em; }
  .gate-sub { color: var(--sub); font-size: 13px; margin-bottom: 26px; }
  label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink);
    font-size: 16px; /* iOSの自動ズーム防止 */
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--mid); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; padding: 13px; border: 0; border-radius: 10px;
    background: var(--navy); color: var(--bg);
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  #err { color: var(--bad); font-size: 13px; min-height: 20px; margin-top: 10px; }
  .note { font-size: 11px; color: var(--sub); margin-top: 20px; line-height: 1.6; }

  /* ---------- 本体 ---------- */
  #app { display: none; }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-top, 0)) ;
    padding-top: max(14px, env(safe-area-inset-top));
  }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .head-row h1 { font-size: 16px; }
  .stamp { font-size: 11px; color: var(--sub); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 64px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin: 16px 0; }
  .stat { background: var(--soft); border-radius: 12px; padding: 12px; position: relative; overflow: hidden; }
  .stat b { display: block; font-size: 22px; color: var(--navy); line-height: 1.2; }
  .stat span { font-size: 11px; color: var(--sub); }
  .stat.alert b { color: var(--bad); }
  .stat i {
    position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px;
    background: var(--pale); border-radius: 26px 0 0 0; opacity: .5;
  }

  nav { display: flex; gap: 6px; margin: 4px 0 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  nav button {
    width: auto; flex: 0 0 auto; padding: 8px 15px; border-radius: 999px;
    background: transparent; color: var(--sub); border: 1px solid var(--line);
    font-size: 13px; font-weight: 500;
  }
  nav button.on {
    background: linear-gradient(96deg, var(--c1), var(--c6));
    color: #fff; border-color: transparent; font-weight: 700;
    box-shadow: 0 3px 10px color-mix(in srgb, var(--c1) 40%, transparent);
  }
  nav button:not(.on):hover { color: var(--c1); border-color: color-mix(in srgb, var(--c1) 40%, var(--line)); }

  #q { margin-bottom: 14px; }

  .card {
    border: 1px solid color-mix(in srgb, var(--c5) 12%, var(--line)); border-radius: 16px;
    background: var(--card); padding: 16px 17px; margin-bottom: 11px;
    box-shadow: 0 2px 10px rgba(10, 40, 70, .04);
  }
  .card-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-top h3 { margin: 0; font-size: 15px; color: var(--navy); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .desc { font-size: 13px; color: var(--sub); margin: 7px 0 0; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 11px; }
  .tag {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: var(--soft); color: var(--sub); white-space: nowrap;
  }
  .tag.on { background: color-mix(in srgb, var(--c3) 20%, transparent); color: var(--c3); font-weight: 700; }
  .tag.off { background: color-mix(in srgb, var(--c2) 22%, transparent); color: var(--c2); font-weight: 600; }
  .tag.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); font-weight: 700; }
  .tag.navy { background: var(--navy); color: var(--bg); }
  :root[data-theme="dark"] .tag.navy { color: #0e1620; }

  details { margin-top: 11px; }
  summary { font-size: 12px; color: var(--mid); cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .detail-body { font-size: 12px; color: var(--sub); margin-top: 9px; }
  .detail-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; background: var(--soft); padding: 1px 5px; border-radius: 4px;
    word-break: break-all;
  }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 6px; }
  .kv dt { color: var(--sub); white-space: nowrap; }
  .kv dd { margin: 0; }

  .section-title { font-size: 13px; color: var(--sub); margin: 24px 0 11px; letter-spacing: .04em; }
  /* 英字ラベル（tax.hatenabase.jp の FEATURES ラベル準拠） */
  .eyebrow {
    display: flex; align-items: center; gap: 0;
    font-size: 10px; letter-spacing: .18em; color: var(--c5);
    font-weight: 700; margin: 28px 0 12px;
  }
  .eye-emo { font-size: 14px; margin-right: 9px; letter-spacing: 0; line-height: 1; }
  .eyebrow b {
    font-size: 13.5px; letter-spacing: .02em; color: var(--ink);
    font-weight: 700; margin-left: 12px;
  }
  .eyebrow em { font-style: normal; color: var(--sub); font-weight: 400; margin-left: 8px; letter-spacing: 0; font-size: 11px; }
  .empty { color: var(--sub); font-size: 13px; padding: 30px 0; text-align: center; }
  .scroller { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--c5); font-weight: 700; font-size: 11px; letter-spacing: .04em; }
  table.grid tr:hover td { background: color-mix(in srgb, var(--c6) 7%, transparent); }
  /* ---------- グラフ（外部ライブラリなし・4トーン厳守） ---------- */
  .chart { margin-top: 4px; }
  .bar-row { display: grid; grid-template-columns: minmax(96px, 34%) 1fr auto; gap: 10px; align-items: center; margin-bottom: 7px; }
  .bar-label {
    font-size: 11.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bar-track { display: block; background: var(--soft); border-radius: 8px; height: 16px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; border-radius: 8px; min-width: 4px; }
  .bar-val { font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

  /* 積み上げバー（構成比） */
  .stack { display: flex; height: 30px; border-radius: 9px; overflow: hidden; margin-bottom: 11px; }
  .stack div { display: grid; place-items: center; font-size: 10.5px; font-weight: 600; color: #fff; min-width: 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--sub); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; display: block; border-radius: 4px; }

  /* 表 */
  table.grid th { cursor: pointer; user-select: none; white-space: nowrap; }
  table.grid th:hover { color: var(--ink); }
  table.grid th[data-dir]::after { content: " ▾"; }
  table.grid th[data-dir="asc"]::after { content: " ▴"; }
  table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.grid td.name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .view-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  .view-toggle button {
    width: auto; padding: 6px 13px; font-size: 12px; border-radius: 8px;
    background: transparent; color: var(--sub); border: 1px solid var(--line); font-weight: 500;
  }
  .view-toggle button.on { background: var(--navy); color: var(--bg); border-color: var(--navy); }
  :root[data-theme="dark"] .view-toggle button.on { color: #0e1620; }

  .theme-btn {
    width: auto; padding: 6px 10px; font-size: 12px; background: transparent;
    color: var(--sub); border: 1px solid var(--line); border-radius: 8px; font-weight: 500;
  }

  /* ---------- AI社員ミカ（人格まわり） ---------- */
  .avatar { display: block; flex: 0 0 auto; border-radius: 50%; background: var(--blush); overflow: hidden; }
  .avatar svg { display: block; width: 100%; height: 100%; }
  .ident { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .ident .avatar { outline: 2px solid color-mix(in srgb, var(--c1) 50%, transparent); outline-offset: 1.5px; }
  .ident h1 { display: flex; align-items: center; gap: 7px; font-size: 17px; margin: 0; letter-spacing: .04em; }
  .role {
    font-size: 9.5px; color: #fff; font-weight: 700; letter-spacing: .12em;
    background: linear-gradient(96deg, var(--c1), var(--c6)); padding: 2px 8px; border-radius: 999px;
  }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 3px rgba(46,125,50,.14); animation: beat 2.4s ease-in-out infinite;
  }
  :root[data-theme="dark"] .pulse { box-shadow: 0 0 0 3px rgba(109,187,113,.16); }
  @keyframes beat { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }

  .bubble {
    position: relative; margin: 16px 0 4px; padding: 13px 16px;
    background: color-mix(in srgb, var(--rose) 13%, var(--card)); border-radius: 4px 14px 14px 14px;
    font-size: 13px; color: var(--ink); line-height: 1.75;
  }
  .bubble b { color: var(--rose); font-weight: 600; }
  .bubble .sig { display: block; margin-top: 6px; font-size: 11px; color: var(--sub); }
  #gate {
    background:
      radial-gradient(120% 90% at 12% 4%, color-mix(in srgb, var(--c6) 26%, transparent) 0%, transparent 52%),
      radial-gradient(110% 90% at 92% 10%, color-mix(in srgb, var(--c2) 22%, transparent) 0%, transparent 52%),
      radial-gradient(120% 100% at 50% 104%, color-mix(in srgb, var(--c4) 22%, transparent) 0%, transparent 58%),
      var(--bg);
  }
  .gate-card .avatar {
    margin: 0 auto 16px; border: 4px solid var(--card);
    outline: 3px solid color-mix(in srgb, var(--c1) 45%, transparent); outline-offset: 2px;
    box-shadow: 0 12px 28px rgba(10,40,70,.14);
    animation: float 5s ease-in-out infinite;
  }
  .gate-card h1 {
    text-align: center; font-size: 23px;
    background: linear-gradient(96deg, var(--c1), var(--c5) 55%, var(--c4));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .gate-card .gate-sub { text-align: center; }
  #gate button[type="submit"] { background: linear-gradient(96deg, var(--c1), var(--c6)); color: #fff; }

  /* ---------- KPIタイル ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px; margin-bottom: 6px; }
  .kpi {
    --k: var(--c4);
    background: color-mix(in srgb, var(--k) 11%, var(--card));
    border: 1px solid color-mix(in srgb, var(--k) 26%, transparent);
    border-radius: 16px; padding: 13px 15px; position: relative; overflow: hidden;
    transition: transform .16s ease;
  }
  .kpi:hover { transform: translateY(-2px); }
  .kpi u { display: block; font-size: 10px; letter-spacing: .12em; color: var(--k); text-decoration: none; font-weight: 700; }
  .kpi b { display: block; font-size: 25px; line-height: 1.25; color: var(--k); font-variant-numeric: tabular-nums; }
  .kpi b small { font-size: 13px; font-weight: 500; color: var(--sub); margin-left: 2px; }
  .kpi span { font-size: 11px; color: var(--sub); }
  .kpi i {
    position: absolute; right: -10px; bottom: -10px; width: 34px; height: 34px;
    background: var(--k); border-radius: 34px 0 0 0; opacity: .28;
  }

  /* ---------- 日別スパークバー ---------- */
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 108px; margin-top: 6px; }
  .spark span {
    flex: 1 1 0; min-width: 0; border-radius: 5px 5px 2px 2px;
    background: linear-gradient(to top, var(--c4), var(--c5));
    display: block; position: relative; transition: filter .15s ease;
  }
  .spark span:hover { filter: brightness(1.15) saturate(1.2); }
  .spark span.wk { background: linear-gradient(to top, var(--c3), color-mix(in srgb, var(--c3) 45%, var(--card))); }
  .spark span.hi {
    background: linear-gradient(to top, var(--c1), var(--c2));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c1) 35%, transparent);
  }
  .spark-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--sub); margin-top: 5px; }

  /* ---------- 時間帯ヒート ---------- */
  .heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-top: 6px; }
  .heat i { display: block; height: 30px; border-radius: 7px; background: var(--soft); }
  .heat-x { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; font-size: 9px; color: var(--sub); margin-top: 4px; text-align: center; }

  /* ---------- 週間タイムライン ---------- */
  .tl { display: grid; grid-template-columns: 44px repeat(7, minmax(64px, 1fr)); gap: 3px; min-width: 560px; }
  .tl-h { font-size: 10.5px; color: var(--sub); text-align: center; padding: 4px 0; font-weight: 600; }
  .tl-h.we { color: var(--rose); }
  .tl-t { font-size: 10px; color: var(--sub); text-align: right; padding: 5px 6px 0 0; font-variant-numeric: tabular-nums; }
  .tl-c { background: var(--soft); border-radius: 5px; min-height: 26px; padding: 2px; }
  .chip {
    display: block; font-size: 9.5px; line-height: 1.55; padding: 2.5px 6px; border-radius: 6px;
    background: var(--j, var(--navy)); color: #fff; margin-bottom: 2px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .chip.off { background: transparent; color: var(--sub); border: 1px dashed var(--line); font-weight: 400; }

  /* ---------- 内訳バー ---------- */
  .split { display: flex; height: 38px; border-radius: 11px; overflow: hidden; margin-bottom: 10px; }
  .split div { display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; min-width: 0; }
  .badge-model {
    display: inline-block; font-size: 10.5px; padding: 3px 10px; border-radius: 999px;
    background: var(--m, var(--navy)); color: #fff; font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 2px 6px color-mix(in srgb, var(--m, var(--navy)) 40%, transparent);
  }
  .hint { font-size: 11px; color: var(--sub); margin: 8px 0 0; line-height: 1.65; }

  /* ---------- ミカのヒーロー ---------- */
  .hero {
    position: relative; overflow: hidden; margin: 18px 0 6px;
    border-radius: 26px; padding: 30px 28px 26px;
    background:
      radial-gradient(120% 130% at 8% 0%, color-mix(in srgb, var(--c6) 34%, transparent) 0%, transparent 46%),
      radial-gradient(100% 120% at 95% 15%, color-mix(in srgb, var(--c2) 30%, transparent) 0%, transparent 50%),
      radial-gradient(120% 140% at 60% 105%, color-mix(in srgb, var(--c4) 26%, transparent) 0%, transparent 55%),
      linear-gradient(120deg, color-mix(in srgb, var(--c1) 14%, var(--card)), var(--soft) 70%);
    display: flex; gap: 24px; align-items: center;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 14% 78%, color-mix(in srgb, var(--c3) 55%, transparent) 0 4px, transparent 5px),
      radial-gradient(circle at 46% 12%, color-mix(in srgb, var(--c5) 55%, transparent) 0 3px, transparent 4px),
      radial-gradient(circle at 88% 82%, color-mix(in srgb, var(--c1) 55%, transparent) 0 5px, transparent 6px),
      radial-gradient(circle at 70% 30%, color-mix(in srgb, var(--c2) 55%, transparent) 0 3px, transparent 4px);
    opacity: .55;
  }
  .hero > * { position: relative; z-index: 1; }
  .hero .avatar {
    width: 116px; height: 116px; flex: 0 0 116px;
    box-shadow: 0 12px 30px rgba(10, 40, 70, .18);
    border: 4px solid var(--card);
    outline: 3px solid color-mix(in srgb, var(--c1) 45%, transparent);
    outline-offset: 2px;
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @media (prefers-reduced-motion: reduce) { .hero .avatar { animation: none } }
  :root[data-theme="dark"] .hero .avatar { box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .hero-body { min-width: 0; flex: 1; }
  .hero-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .hero-name h2 {
    margin: 0; font-size: 27px; letter-spacing: .06em;
    background: linear-gradient(96deg, var(--c1), var(--c5) 55%, var(--c4));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-name em {
    font-style: normal; font-size: 10.5px; letter-spacing: .14em; color: #fff;
    font-weight: 700; background: linear-gradient(96deg, var(--c1), var(--c6));
    padding: 3px 10px; border-radius: 999px;
  }
  .hero-role { font-size: 12px; color: var(--sub); margin: 3px 0 10px; }
  .hero-say { font-size: 13.5px; line-height: 1.85; color: var(--ink); margin: 0; }
  .hero-say b { color: var(--rose); font-weight: 600; }
  .hero-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .hero-chips span {
    font-size: 11px; padding: 5px 12px; border-radius: 999px;
    background: var(--card); color: var(--sub);
    border: 1px solid color-mix(in srgb, var(--c5) 22%, var(--line));
    box-shadow: 0 2px 6px rgba(10,40,70,.06);
  }
  .hero-chips span b { color: var(--c5); font-weight: 700; }
  .hero-chips span:nth-child(2n) b { color: var(--c3); }
  .hero-chips span:nth-child(3n) b { color: var(--c2); }
  .hero-chips span:nth-child(4n) b { color: var(--c1); }
  .hero .deco { position: absolute; right: -26px; top: -26px; width: 150px; opacity: .32; z-index: 0; }
  .hero .deco .mosaic { grid-template-columns: repeat(4, 1fr); width: 150px; }
  .status-dot {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    color: var(--ok); font-weight: 600;
  }
  @media (max-width: 620px) {
    .hero { flex-direction: column; align-items: flex-start; gap: 14px; padding: 22px 20px; }
    .hero .avatar { width: 84px; height: 84px; flex-basis: 84px; }
  }
  /* 各タブでのミカの一言 */
  .say {
    display: flex; gap: 11px; align-items: flex-start;
    margin: 14px 0 4px; font-size: 12.5px; color: var(--ink); line-height: 1.8;
  }
  .say .avatar { width: 30px; height: 30px; flex: 0 0 30px; margin-top: 1px; }
  .say p {
    margin: 0; padding: 10px 15px; border-radius: 3px 15px 15px 15px;
    background: linear-gradient(112deg, color-mix(in srgb, var(--c6) 18%, var(--card)),
                color-mix(in srgb, var(--c4) 12%, var(--card)));
    border: 1px solid color-mix(in srgb, var(--c6) 24%, transparent);
  }
  .say .avatar { background: color-mix(in srgb, var(--c6) 22%, var(--card)); }
  .say b { color: var(--c1); font-weight: 700; }
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="loginForm">
    <span class="avatar" id="hero" style="width:92px;height:92px"></span>
    <h1>AI社員ミカ</h1>
    <p class="gate-sub">はてなベースのバックオフィスを担当しています。<br>ID とパスワードでお通しします。</p>
    <label for="u">ID</label>
    <input id="u" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label for="p">パスワード</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button type="submit" id="go">開く</button>
    <p id="err"></p>
    <p class="note">
      データは AES-GCM で暗号化されています。ID とパスワードの両方を鍵材料に
      PBKDF2（60万回）で復号するため、端末側で数秒かかります。
    </p>
  </form>
</div>

<div id="app">
  <header>
    <div class="wrap" style="padding-bottom:0">
      <div class="head-row">
        <div class="ident">
          <span class="avatar" id="face" style="width:44px;height:44px"></span>
          <div>
            <h1>AI社員ミカ<em class="role">BACK OFFICE</em><span class="pulse"></span></h1>
            <p class="stamp" id="stamp"></p>
          </div>
        </div>
        <button class="theme-btn" id="themeBtn" type="button">配色</button>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <nav id="tabs">
      <button class="on" data-t="overview">概要</button>
      <button data-t="usage">稼働・トークン</button>
      <button data-t="cron">定期実行</button>
      <button data-t="agents">エージェント</button>
      <button data-t="skills">スキル</button>
      <button data-t="health">健全性</button>
      <button data-t="links">連携</button>
    </nav>
    <input id="q" type="search" placeholder="名前・説明で絞り込む" autocapitalize="off" autocorrect="off">
    <div id="view"></div>
  </div>
</div>

/* ---------- 幾何学モザイク ----------
   名刺由来のタイル語彙（正方形・1/4円・円・葉型）を4トーンで組む。
   名前から決定的に形と色を選ぶので、同じスキルは常に同じ模様になる。 */
const SHAPES = ["t-sq", "t-ci", "t-qtl", "t-qtr", "t-qbr", "t-qbl", "t-leaf", "t-half"];
const TONES = ["c-1", "c-2", "c-3", "c-4", "c-5", "c-6"];

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}

function tiles(seed, n) {
  const h = hash(seed);
  let out = "";
  for (let i = 0; i < n; i++) {
    const a = Math.abs((h >> (i * 3)) ^ (h * (i + 1)));
    // 一部を余白にして詰まりすぎないようにする（仕様の「余白の署名」）
    const blank = n > 4 && (a % 7 === 0);
    const shape = SHAPES[a % SHAPES.length];
    const tone = blank ? "c-none" : TONES[(a >> 5) % TONES.length];
    out += `<i class="${blank ? "" : shape} ${tone}"></i>`;
  }
  return out;
}

function mosaic(seed, n, cls) {
  return `<div class="mosaic ${cls}">${tiles(seed, n)}</div>`;
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// ビルドごとに salt が変わるので、キャッシュキーに混ぜておくと
// 再デプロイ時に古いデータが自動で無効になる（項目が増えた直後の描画崩れを防ぐ）
const CACHE_KEY = "claude-ops:" + PAYLOAD.salt.slice(0, 12);
// 旧バージョンの残骸を掃除する
Object.keys(sessionStorage).forEach(k => {
  if (k === "claude-ops" || (k.startsWith("claude-ops:") && k !== CACHE_KEY)) {
    sessionStorage.removeItem(k);
  }
});

async function decrypt(user, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey(
    "raw", enc.encode(user + "\0" + pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(PAYLOAD.nonce) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#go");
  btn.disabled = true; btn.textContent = "復号中…"; $("#err").textContent = "";
  try {
    DATA = await decrypt($("#u").value.trim(), $("#p").value);
    sessionStorage.setItem(CACHE_KEY, JSON.stringify(DATA));
    start();
  } catch (err) {
    $("#err").textContent = "ID またはパスワードが違います";
    btn.disabled = false; btn.textContent = "開く";
  }
});

    ["AGENTS", s.agents_global + s.agents_project, "本", "専門の相棒", "var(--c5)", "🤝"],

  if (u) {
    items.push(["TOKENS", jpNum(u.totals.total), "", `使ったトークン（${u.period.days}日）`, "var(--c2)", "⚡"]);
    items.push(["COST", usd(u.totals.cost), "", "API換算コスト", "var(--c1)", "💰"]);
  }
  items.push(["ALERT", s.broken_paths, "件", "参照切れ",
    s.broken_paths > 0 ? "var(--bad)" : "var(--c3)", s.broken_paths > 0 ? "🚧" : "✅"]);

  $("#stats").className = "kpis";

       <b>${n}${unit ? `<small>${unit}</small>` : ""}</b>
       <span>${label}</span><i></i>

}

function say(html, mood) {

/* 次に動く定期実行を求める */
function nextRun() {
  const now = new Date();
  const todayIdx = (now.getDay() + 6) % 7; // 0=月
  let best = null;
  (DATA.schedules || []).filter(r => r.enabled).forEach(r =>
    (r.slots || []).forEach(s => {
      // s.weekday は 1=月 … 7=日
      let diff = (s.weekday - 1) - todayIdx;
      if (diff < 0) diff += 7;
      const mins = diff * 1440 + s.hour * 60 + s.minute
        - (now.getHours() * 60 + now.getMinutes());
      const wait = mins <= 0 ? mins + 7 * 1440 : mins;
      if (!best || wait < best.wait) best = { wait, s, job: r.job };
    }));
  if (!best) return null;
  const d = best.wait < 1440 && (best.s.weekday - 1) === todayIdx ? "今日"
    : best.wait < 2880 ? "明日" : WD[best.s.weekday - 1] + "曜";
  return `${d} ${best.s.hour}:${String(best.s.minute).padStart(2, "0")} ${best.job}`;
}

function match(o, q) {
  if (!q) return true;
  return ((o.name || "") + " " + (o.description || "") + " " + (o.dir || ""))
    .toLowerCase().includes(q);
}

function render() {
  const q = $("#q").value.trim().toLowerCase();

  try {

    else if (TAB === "agents") v.innerHTML = viewAgents(q);

/* ---------- グラフ部品 ---------- */
const TONE_HEX = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];
/* モデルごとに色を決めておく（同じモデルは常に同じ色） */
const MODEL_COLOR = {
  "claude-opus-5": "var(--c5)", "claude-opus-4-8": "var(--c4)",
  "claude-opus-4-7": "var(--c4)", "claude-opus-4-6": "var(--c4)",
  "claude-fable-5": "var(--c2)", "claude-fable-5-1": "var(--c2)",
  "claude-sonnet-5": "var(--c3)", "claude-sonnet-4-6": "var(--c3)",
  "claude-haiku-4-5": "var(--c6)",
};
const colorOf = seed => TONE_HEX[hash(String(seed)) % TONE_HEX.length];

function barChart(rows, unit) {
  const max = Math.max(...rows.map(r => r.value), 1);
  const n = rows.length;
  return `<div class="chart">` + rows.map((r, i) => `
    <div class="bar-row">
      <span class="bar-label" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="bar-track">
        <span class="bar-fill" style="width:${Math.max(3, r.value / max * 100)}%;background:${
          r.color || TONE_HEX[i % TONE_HEX.length]}"></span>
      </span>
      <span class="bar-val">${r.value}${unit || ""}</span>
    </div>`).join("") + `</div>`;
}

function stackChart(parts) {
  const total = parts.reduce((s, p) => s + p.value, 0) || 1;
  return `<div class="stack">` + parts.filter(p => p.value).map((p, i) => `
    <div style="width:${p.value / total * 100}%;background:${TONE_HEX[i % TONE_HEX.length]}"
         title="${esc(p.label)} ${p.value}">${p.value / total > .08 ? p.value : ""}</div>`).join("")
    + `</div><div class="legend">` + parts.map((p, i) =>
      `<span><i style="background:${TONE_HEX[i % TONE_HEX.length]}"></i>${esc(p.label)} ${p.value}</span>`).join("") + `</div>`;
}

/* ---------- 数値の書式 ---------- */
const jpNum = n => n >= 1e8 ? (n / 1e8).toFixed(2) + "億"
  : n >= 1e4 ? Math.round(n / 1e4).toLocaleString() + "万"
  : Math.round(n).toLocaleString();
const usd = n => "$" + (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(2));
const WD = ["月", "火", "水", "木", "金", "土", "日"];

function barChartF(rows, fmt, colorFn) {
  const max = Math.max(...rows.map(r => r.value), 1);
  const n = rows.length;
  return `<div class="chart">` + rows.map((r, i) => `
    <div class="bar-row">
      <span class="bar-label" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="bar-track">
        <span class="bar-fill" style="width:${Math.max(3, r.value / max * 100)}%;background:${
          colorFn ? colorFn(r, i) : TONE_HEX[i % TONE_HEX.length]}"></span>
      </span>
      <span class="bar-val">${fmt(r.value)}</span>
    </div>`).join("") + `</div>`;
}

/* 日別の縦棒。土日は淡く、最大値だけアクセント色にする */
function sparkChart(days, val, fmt) {
  const get = typeof val === "function" ? val : d => d[val];
  const max = Math.max(...days.map(get), 1);
  const bars = days.map(d => {
    const v = get(d);
    const dow = new Date(d.date + "T12:00:00Z").getUTCDay(); // 0=日
    const cls = v === max ? "hi" : (dow === 0 || dow === 6 ? "wk" : "");
    return `<span class="${cls}" style="height:${Math.max(2, v / max * 100)}%"
      title="${d.date}（${WD[(dow + 6) % 7]}） ${fmt(v)}"></span>`;
  }).join("");
  const f = days[0], l = days[days.length - 1];
  return `<div class="spark">${bars}</div>
    <div class="spark-x"><span>${f ? f.date.slice(5) : ""}</span>
      <span>最大 ${fmt(max)}</span><span>${l ? l.date.slice(5) : ""}</span></div>`;
}

/* 時間帯（JST）の稼働。出力トークン量の濃淡で見せる */
function heatChart(hours) {
  const max = Math.max(...hours, 1);
  const cells = hours.map((v, h) => `<i style="background:${
    v ? `color-mix(in srgb, ${v / max > .55 ? "var(--c1)" : v / max > .25 ? "var(--c2)" : "var(--c3)"} ${
      Math.round(24 + v / max * 76)}%, var(--soft))` : "var(--soft)"
  }" title="${h}時台 ${jpNum(v)}"></i>`).join("");
  const labels = hours.map((_, h) => `<span>${h % 3 === 0 ? h : ""}</span>`).join("");
  return `<div class="heat">${cells}</div><div class="heat-x">${labels}</div>`;
}

/* 週間タイムライン。曜日×時刻の枠に、その時間に起きるジョブを並べる */
function weekTimeline(rows) {
  const slots = [];
  rows.forEach(r => (r.slots || []).forEach(s =>
    slots.push({ ...s, job: r.job, on: r.enabled })));
  if (!slots.length) return `<p class="empty">時刻指定の定期実行はありません</p>`;
  const hours = [...new Set(slots.map(s => s.hour))].sort((a, b) => a - b);
  const today = (new Date().getDay() + 6) % 7; // 0=月
  const head = `<div></div>` + WD.map((w, i) =>
    `<div class="tl-h${i >= 5 ? " we" : ""}"${i === today ? ' style="color:var(--rose)"' : ""}>${w}</div>`).join("");
  const body = hours.map(h => {
    const cells = [1, 2, 3, 4, 5, 6, 7].map(wd => {
      const here = slots.filter(s => s.weekday === wd && s.hour === h)
        .sort((a, b) => a.minute - b.minute);
      return `<div class="tl-c">` + here.map(s =>
        `<span class="chip${s.on ? "" : " off"}" style="--j:${colorOf(s.job)}"
          title="${esc(s.job)} ${h}:${String(s.minute).padStart(2, "0")}"
         >${String(s.minute).padStart(2, "0")} ${esc(s.job)}</span>`).join("") + `</div>`;
    }).join("");
    return `<div class="tl-t">${h}:00</div>${cells}`;
  }).join("");
  return `<div class="scroller"><div class="tl">${head}${body}</div></div>`;
}

  // 定期実行のスケジュール表
  const sched = S.filter(s => s.scheduled !== null && s.scheduled !== undefined)
    .sort((a, b) => (b.scheduled === true) - (a.scheduled === true));
  const schedTable = `<div class="card"><div class="scroller"><table class="grid">
    <tr><th>スキル</th><th>状態</th><th>起動条件</th><th>ログ</th></tr>` +
    sched.map(s => `<tr>
      <td class="name">${esc(s.name)}</td>
      <td>${s.scheduled ? '<span class="tag on">稼働</span>' : '<span class="tag off">停止中</span>'}</td>
      <td>${(s.schedule_detail || []).map(esc).join("<br>") || "—"}</td>
      <td><code>${esc(s.schedule_log || "—")}</code></td>
    </tr>`).join("") + `</table></div></div>`;

  // モデル構成
  const models = {};
  A.forEach(a => models[a.model] = (models[a.model] || 0) + 1);
  const modelParts = Object.entries(models)
    .sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: k, value: v }));

  // スキル規模 上位10
  const bigSkills = [...S].sort((a, b) => b.lines - a.lines).slice(0, 10)
    .map(s => ({ label: s.name, value: s.lines }));

  // ツール権限が広いエージェント
  const wide = [...A].filter(a => a.tool_count).sort((a, b) => b.tool_count - a.tool_count)
    .slice(0, 8).map(a => ({ label: a.name, value: a.tool_count }));

  // 定期実行の構成比（sched は上で作った一覧を使い回す）
  const schedParts = [
    { label: "稼働", value: sched.filter(s => s.scheduled).length },
    { label: "停止中", value: sched.filter(s => !s.scheduled).length },
    { label: "定期実行なし", value: S.length - sched.length },
  ];

  const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";

  // よく使うスキル（実行セッション数）
  const used = (DATA.usage?.by_skill || [])
    .filter(x => x.name !== "（対話・アドホック）")
    .slice().sort((a, b) => b.sessions - a.sessions).slice(0, 10)
    .map(x => ({ label: x.name, value: x.sessions, sched: x.scheduled }));

  return `
    ${heroBlock()}

    ${used.length ? `${eyebrow("ROUTINE", "いつも動いているスキル", "実行セッション数 上位10")}
    <div class="card">${barChartF(used, v => v + " 回",
      r => r.sched ? "var(--c1)" : "var(--c4)")}
      <p class="hint"><span style="color:var(--c1)">●</span> 時間になったら自分で動くもの　
        <span style="color:var(--c4)">●</span> 呼ばれたら動くもの</p></div>` : ""}

    ${eyebrow("VOLUME", "全体のボリューム", "定義の総量")}
    <div class="card"><dl class="kv">
      <dt>総行数</dt><dd>${st.total_lines.toLocaleString()} 行</dd>
      <dt>総文字数</dt><dd>${st.total_chars.toLocaleString()} 字</dd>
      <dt>スキル同梱ファイル</dt><dd>${kb(st.bundle_bytes)}（スクリプト同梱 ${st.with_scripts} 本）</dd>
      <dt>接続MCPサーバー</dt><dd>${st.mcp_servers} 種</dd>
    </dl></div>

    ${eyebrow("MODELS", "エージェント定義の指定モデル", `全 ${A.length} 本・実際の消費は「稼働・トークン」へ`)}
    <div class="card">${stackChart(modelParts)}</div>

    ${eyebrow("SCHEDULE", "スキルの実行形態", `全 ${S.length} 本`)}
    <div class="card">${stackChart(schedParts)}</div>

    ${eyebrow("CRON", "定期実行の起動条件", `${sched.length} 本`)}
    ${schedTable}

    ${eyebrow("MCP", "MCPサーバー別の依存", "何本が使っているか")}
    <div class="card">${barChart(mcp, " 本")}</div>

    ${eyebrow("SERVICE", "連携している外部サービス", "定義本文からの検出")}
    <div class="card">${barChart(svc, " 本")}</div>

    ${eyebrow("SIZE", "スキルの規模", "定義の行数 上位10")}
    <div class="card">${barChart(bigSkills, " 行")}</div>

    ${eyebrow("PERMISSION", "ツール権限の広さ", "エージェント 上位8")}
    <div class="card">${barChart(wide, "")}</div>
  `;
}

/* ---------- 表 ---------- */
function sortRows(rows) {
  const { key, dir } = SORT;
  return [...rows].sort((a, b) => {
    let x = a[key], y = b[key];
    if (typeof x === "string" || typeof y === "string") {
      x = String(x ?? ""); y = String(y ?? "");
      return dir === "asc" ? x.localeCompare(y) : y.localeCompare(x);
    }
    x = x ?? -1; y = y ?? -1;
    return dir === "asc" ? x - y : y - x;
  });
}

function th(key, label, cls) {
  const dir = SORT.key === key ? SORT.dir : "";
  return `<th data-sort="${key}"${dir ? ` data-dir="${dir}"` : ""} class="${cls || ""}">${label}</th>`;
}

function agentTable(list) {
  return `<div class="card"><div class="scroller"><table class="grid">
    <tr>${th("name", "名前")}${th("model", "モデル")}${th("tool_count", "ツール", "num")}${
      th("lines", "行数", "num")}${th("scope", "スコープ")}${th("last_touched", "更新")}</tr>` +
    sortRows(list).map(a => `<tr>
      <td class="name">${esc(a.name)}</td>
      <td>${esc(a.model)}</td>
      <td class="num">${a.tool_count ?? "全"}</td>
      <td class="num">${a.lines}</td>
      <td>${a.scope === "global" ? "グローバル" : esc(a.scope)}</td>
      <td>${esc(a.last_touched || "-")}</td>
    </tr>`).join("") + `</table></div></div>`;
}

function skillTable(list) {
  return `<div class="card"><div class="scroller"><table class="grid">
    <tr>${th("name", "名前")}${th("scheduled", "定期実行")}${th("lines", "行数", "num")}${
      th("tool_count", "ツール", "num")}${th("last_touched", "更新")}</tr>` +
    sortRows(list).map(s => `<tr>
      <td class="name">${esc(s.name)}</td>
      <td>${s.scheduled === true ? '<span class="tag on">稼働</span>'
          : s.scheduled === false ? '<span class="tag off">停止中</span>' : "—"}</td>
      <td class="num">${s.lines}</td>
      <td class="num">${s.tool_count ?? "—"}</td>
      <td>${esc(s.last_touched || "-")}</td>
    </tr>`).join("") + `</table></div></div>`;
}

function viewToggle(cur, target) {
  return `<div class="view-toggle" data-target="${target}">
    <button data-v="card" class="${cur === "card" ? "on" : ""}">カード</button>
    <button data-v="table" class="${cur === "table" ? "on" : ""}">表</button>
  </div>`;
}

// 表のソート・表示切替
$("#view").addEventListener("click", e => {
  const sortTh = e.target.closest("th[data-sort]");
  if (sortTh) {
    const key = sortTh.dataset.sort;
    SORT = { key, dir: SORT.key === key && SORT.dir === "desc" ? "asc" : "desc" };
    render(); return;
  }
  const vb = e.target.closest(".view-toggle button");
  if (vb) {
    const target = vb.closest(".view-toggle").dataset.target;
    if (target === "skills") SKILL_VIEW = vb.dataset.v; else AGENT_VIEW = vb.dataset.v;
    render();
  }
});

const EYE_EMOJI = {
  VOLUME: "📦", MODELS: "🧠", MODEL: "🧠", SCHEDULE: "🗓", CRON: "⏰", MCP: "🔌",
  SERVICE: "🌐", SIZE: "📏", PERMISSION: "🔑", ROUTINE: "🔁", DAILY: "📈",
  "DAILY COST": "💰", PRICE: "🏷", BREAKDOWN: "🧩", SKILL: "✨", HOURS: "🕐",
  TOOLS: "🛠", SUBAGENT: "🤝", TIMELINE: "🗓", SHEET: "📋", EVENT: "⚡",
  CALL: "📣", BROKEN: "🚧", LINK: "🔗", AGENT: "🤖",
};
function eyebrow(en, ja, note) {
  const emo = EYE_EMOJI[en] || "🌸";
  return `<p class="eyebrow"><span class="eye-emo">${emo}</span>${esc(en)}<b>${esc(ja)}</b>${
    note ? `<em>${esc(note)}</em>` : ""}</p>`;
}

function toolList(tools) {
  if (!tools || !tools.length) return "<em>全ツール</em>";
  return tools.map(t => `<code>${esc(t)}</code>`).join(" ");
}

// ツールをMCPサーバーごとにまとめて出す
function toolGroups(groups) {
  const keys = Object.keys(groups || {});
  if (!keys.length) return "<em>全ツール</em>";
  return keys.map(k => `<div style="margin-bottom:5px">
    <span class="tag navy">${esc(k)}</span> ${groups[k].map(t =>
      `<code>${esc(t.replace(/^mcp__[^_]+(?:_[^_]+)*?__/, ""))}</code>`).join(" ")}</div>`).join("");
}

function tagRow(items, cls) {
  if (!items || !items.length) return "";
  return `<div class="meta">${items.map(x => `<span class="tag ${cls || ""}">${esc(x)}</span>`).join("")}</div>`;
}

function historyList(h) {
  if (!h || !h.length) return "—";
  return h.map(x => `<div><span class="tag">${esc(x.date)}</span> ${esc(x.subject)}</div>`).join("");
}

function pathList(checks) {
  if (!checks || !checks.length) return "—";
  return checks.map(c =>
    `<div>${c.exists ? "" : '<span class="tag bad">切れ</span> '}<code>${esc(c.path)}</code></div>`).join("");
}

function fileList(files) {
  if (!files || !files.length) return "";
  return files.map(f => `<code>${esc(f.path)}</code>${
    f.bytes ? ` <span class="bar-val">${(f.bytes / 1024).toFixed(1)}KB</span>` : ""}`).join("　");
}

function viewAgents(q) {
  const list = DATA.agents.filter(a => match(a, q));
  if (!list.length) return `<p class="empty">該当なし</p>`;
  const g = list.filter(a => a.scope === "global");
  const p = list.filter(a => a.scope !== "global");
  const card = a => `
    <div class="card">
      <div class="card-top">
        ${mosaic(a.name, 4, "mini")}
        <h3>${esc(a.name)}</h3>
        <span class="tag navy">${esc(a.model)}</span>
        ${a.scope !== "global" ? `<span class="tag">${esc(a.scope)} 限定</span>` : ""}
      </div>
      <p class="desc">${esc(a.description)}</p>
      <div class="meta">
        <span class="tag">ツール ${a.tool_count ?? "全"}</span>
        <span class="tag">${a.lines} 行</span>
        ${a.last_touched ? `<span class="tag">更新 ${esc(a.last_touched)}</span>` : ""}
        ${a.path_checks.some(c => !c.exists) ? `<span class="tag bad">参照切れ</span>` : ""}
      </div>
      ${tagRow(a.services)}
      <details>
        <summary>詳細</summary>
        <div class="detail-body">
          <dl class="kv">
            <dt>定義</dt><dd><code>${esc(a.file)}</code></dd>
            <dt>規模</dt><dd>${a.lines} 行 / ${(a.chars || 0).toLocaleString()} 字</dd>
            <dt>ツール</dt><dd>${toolGroups(a.tool_groups)}</dd>
            ${a.sections.length ? `<dt>構成</dt><dd>${a.sections.map(esc).join(" / ")}</dd>` : ""}
            ${a.subsections && a.subsections.length ?
              `<dt>小見出し</dt><dd>${a.subsections.slice(0, 20).map(esc).join(" / ")}</dd>` : ""}
            ${a.intro ? `<dt>冒頭</dt><dd>${esc(a.intro)}…</dd>` : ""}
            ${a.path_checks.length ? `<dt>参照パス</dt><dd>${pathList(a.path_checks)}</dd>` : ""}
            ${a.history && a.history.length ? `<dt>変更履歴</dt><dd>${historyList(a.history)}</dd>` : ""}
          </dl>
        </div>
      </details>
    </div>`;
  const toggle = viewToggle(AGENT_VIEW, "agents");
  if (AGENT_VIEW === "table") return toggle + agentTable(list);
  return toggle
       + (g.length ? eyebrow("GLOBAL", "グローバル", "全プロジェクトで使える") + g.map(card).join("") : "")
       + (p.length ? eyebrow("SCOPED", "プロジェクト限定", "特定リポジトリでのみ有効") + p.map(card).join("") : "");
}

function viewSkills(q) {
  const list = DATA.skills.filter(s => match(s, q));
  if (!list.length) return `<p class="empty">該当なし</p>`;
  const rank = s => s.scheduled === true ? 0 : s.scheduled === false ? 1 : 2;
  list.sort((a, b) => rank(a) - rank(b) || b.lines - a.lines);
  const toggle = viewToggle(SKILL_VIEW, "skills");
  if (SKILL_VIEW === "table") return toggle + skillTable(list);
  return toggle + eyebrow("SKILLS", "スキル", "定期実行が稼働中のものから並ぶ") + list.map(s => `
    <div class="card">
      <div class="card-top">
        ${mosaic(s.name, 4, "mini")}
        <h3>${esc(s.name)}</h3>
        ${s.scheduled === true ? `<span class="tag on">定期実行 稼働</span>` : ""}
        ${s.scheduled === false ? `<span class="tag off">定期実行 停止中</span>` : ""}
      </div>
      <p class="desc">${esc(s.description)}</p>
      <div class="meta">
        <span class="tag">${s.lines} 行</span>
        ${s.tool_count ? `<span class="tag">ツール ${s.tool_count}</span>` : ""}
        ${s.scripts.length ? `<span class="tag">スクリプト ${s.scripts.length}</span>` : ""}
        ${s.reference_docs.length ? `<span class="tag">参考資料 ${s.reference_docs.length}</span>` : ""}
        ${s.last_touched ? `<span class="tag">更新 ${esc(s.last_touched)}</span>` : ""}
        ${s.path_checks.some(c => !c.exists) ? `<span class="tag bad">参照切れ</span>` : ""}
      </div>
      ${(s.schedule_detail || []).length ?
        `<div class="meta">${s.schedule_detail.map(x =>
          `<span class="tag ${s.scheduled ? "on" : "off"}">${esc(x)}</span>`).join("")}</div>` : ""}
      ${tagRow(s.triggers)}
      ${tagRow(s.services)}
      <details>
        <summary>詳細</summary>
        <div class="detail-body">
          <dl class="kv">
            <dt>定義</dt><dd><code>${esc(s.file)}</code></dd>
            <dt>規模</dt><dd>${s.lines} 行 / ${(s.chars || 0).toLocaleString()} 字${
              s.bundle_bytes ? ` / 同梱込み ${(s.bundle_bytes / 1024).toFixed(0)}KB` : ""}</dd>
            ${s.arguments ? `<dt>引数</dt><dd>${esc(s.arguments)}</dd>` : ""}
            ${s.triggers.length ? `<dt>起動ワード</dt><dd>${s.triggers.map(esc).join(" / ")}</dd>` : ""}
            ${s.schedule_command ? `<dt>実行コマンド</dt><dd><code>${esc(s.schedule_command)}</code></dd>` : ""}
            ${s.schedule_log ? `<dt>ログ</dt><dd><code>${esc(s.schedule_log)}</code></dd>` : ""}
            ${s.tools.length ? `<dt>ツール</dt><dd>${toolGroups(s.tool_groups)}</dd>` : ""}
            ${s.steps && s.steps.length ? `<dt>手順</dt><dd>${s.steps.map(esc).join("<br>")}</dd>` : ""}
            ${s.sections.length ? `<dt>構成</dt><dd>${s.sections.slice(0, 20).map(esc).join(" / ")}</dd>` : ""}
            ${s.scripts.length ? `<dt>同梱スクリプト</dt><dd>${fileList(s.scripts)}</dd>` : ""}
            ${s.reference_docs.length ? `<dt>参考資料</dt><dd>${fileList(s.reference_docs.slice(0, 12))}</dd>` : ""}
            ${s.path_checks.length ? `<dt>参照パス</dt><dd>${pathList(s.path_checks)}</dd>` : ""}
            ${s.history && s.history.length ? `<dt>変更履歴</dt><dd>${historyList(s.history)}</dd>` : ""}
          </dl>
        </div>
      </details>
    </div>`).join("");
}

function viewHealth() {
  const broken = DATA.broken_paths || [];
  const sched = DATA.skills.filter(s => s.scheduled !== null && s.scheduled !== undefined);
  let html = broken.length
    ? say(`参照切れが <b>${broken.length}</b> 件あります。日付やフォルダ名を後から埋める書き方
        （YYYY-MM-DD や &lt;会社名&gt;）はそのままで大丈夫ですが、それ以外は直したほうが安全です。`, "worry")
    : say(`参照切れはありません。定義から呼んでいるパスはすべて実在しています。`);

  html += eyebrow("BROKEN", "参照切れパス", `${broken.length} 件`);
  html += broken.length
    ? `<div class="card"><div class="detail-body">` + broken.map(b =>
        `<div style="margin-bottom:7px"><span class="tag bad">${esc(b.owner)}</span> <code>${esc(b.path)}</code></div>`
      ).join("") + `</div></div>`
    : `<div class="card"><p class="desc">参照切れはありません。</p></div>`;

  html += eyebrow("SCHEDULE", "定期実行", "launchd") + `<div class="card"><div class="scroller"><table>
    <tr><th>スキル</th><th>状態</th></tr>` +
    sched.map(s => `<tr><td>${esc(s.name)}</td><td>${
      s.scheduled ? '<span class="tag on">稼働</span>' : '<span class="tag off">停止中</span>'}</td></tr>`).join("") +
    `</table></div></div>`;

  const noTools = DATA.agents.filter(a => !a.tool_count);
  if (noTools.length) {
    html += eyebrow("PERMISSION", "ツール制限なし", `${noTools.length} 件`) +
      `<div class="card"><p class="desc">全ツールにアクセスできます。権限を絞る余地があります。</p>
      <div class="meta">${noTools.map(a => `<span class="tag">${esc(a.name)}</span>`).join("")}</div></div>`;
  }
  return html;
}

function viewLinks(q) {
  const links = (DATA.links || []).filter(l =>
    !q || (l.from + l.to).toLowerCase().includes(q));
  if (!links.length) return `<p class="empty">連携なし</p>`;
  const byFrom = {};
  links.forEach(l => (byFrom[l.from] = byFrom[l.from] || []).push(l));
  return eyebrow("LINKS", "連携", "定義内で他をどう呼んでいるか") +
    Object.entries(byFrom).map(([from, ls]) => `
    <div class="card">
      <div class="card-top">${mosaic(from, 4, "mini")}<h3>${esc(from)}</h3></div>
      <div class="detail-body">
        ${ls.map(l => `<div>→ <code>${esc(l.to)}</code> <span class="tag">${esc(l.type)}</span></div>`).join("")}
      </div>
    </div>`).join("");
}

/* ---------- 配色切替 ---------- */
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  localStorage.setItem("claude-ops-theme", next);
});
const savedTheme = localStorage.getItem("claude-ops-theme");
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

/* ---------- セッション復帰 ---------- */
const cached = sessionStorage.getItem(CACHE_KEY);
if (cached) {
  try {
    DATA = JSON.parse(cached);
    start();
  } catch (e) {
    sessionStorage.removeItem(CACHE_KEY);
  }
}
</script>
</body>
</html>
